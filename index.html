<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Claude Code Missing Manual</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root {
  --yellow: #FED90F;
  --yellow-dark: #E8C400;
  --yellow-pale: #FFF9D6;
  --sky: #70C8F0;
  --sky-dark: #3AACD8;
  --donut-pink: #E34F8E;
  --donut-glaze: #F5B8D2;
  --springfield-blue: #1B4F8A;
  --orange: #F15A22;
  --green: #4A9E2F;
  --green-pale: #E8F5E0;
  --skin: #FFD5B4;
  --dark: #111111;
  --dark2: #1C1C1C;
  --dark3: #2A2A2A;
  --card-bg: #1E1E1E;
  --card-border: #333333;
  --text: #EFEFEF;
  --text-muted: #9A9A9A;
  --code-bg: #0A0A0A;
  --radius: 14px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== SPRINGFIELD SKY HEADER ===== */
.sky-header {
  background: linear-gradient(180deg, #1B4F8A 0%, #2E7DD6 40%, #70C8F0 80%, #A8DFF0 100%);
  padding: 0;
  position: relative;
  overflow: hidden;
}

.clouds {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
}

.cloud {
  position: absolute;
  background: rgba(255,255,255,0.85);
  border-radius: 50px;
  filter: blur(1px);
}
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: inherit;
  border-radius: 50%;
}
.cloud-1 { width: 120px; height: 35px; top: 15%; left: 5%; animation: drift 18s linear infinite; }
.cloud-1::before { width: 60px; height: 55px; top: -30px; left: 15px; }
.cloud-1::after { width: 50px; height: 45px; top: -20px; right: 15px; }
.cloud-2 { width: 160px; height: 40px; top: 30%; left: 60%; animation: drift 25s linear infinite reverse; }
.cloud-2::before { width: 80px; height: 60px; top: -35px; left: 20px; }
.cloud-2::after { width: 60px; height: 50px; top: -25px; right: 20px; }
.cloud-3 { width: 90px; height: 28px; top: 55%; left: 30%; animation: drift 20s linear infinite; }
.cloud-3::before { width: 45px; height: 40px; top: -22px; left: 10px; }
.cloud-3::after { width: 38px; height: 35px; top: -18px; right: 10px; }

@keyframes drift {
  0% { transform: translateX(-200px); }
  100% { transform: translateX(calc(100vw + 200px)); }
}

.header-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 48px 24px 32px;
}

.donut-row {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 16px;
  font-size: 2.2rem;
  animation: bounce-donuts 2s ease-in-out infinite alternate;
}

@keyframes bounce-donuts {
  from { transform: translateY(0); }
  to { transform: translateY(-8px); }
}

h1 {
  font-family: 'Permanent Marker', cursive;
  font-size: clamp(2rem, 6vw, 4rem);
  color: var(--yellow);
  text-shadow: 3px 3px 0 var(--springfield-blue), 5px 5px 0 rgba(0,0,0,0.3);
  line-height: 1.1;
  margin-bottom: 8px;
  letter-spacing: -1px;
}

.subtitle {
  font-family: 'Permanent Marker', cursive;
  font-size: clamp(0.9rem, 2.5vw, 1.3rem);
  color: #FFF;
  text-shadow: 1px 1px 0 var(--springfield-blue);
  margin-bottom: 24px;
  opacity: 0.95;
}

/* ===== STICKY NAV ===== */
.sticky-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(17,17,17,0.97);
  backdrop-filter: blur(12px);
  border-bottom: 2px solid var(--card-border);
  padding: 12px 16px 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.nav-row {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.row-label {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.pills {
  display: flex;
  gap: 6px;
  flex-wrap: nowrap;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.pills::-webkit-scrollbar { display: none; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1.5px solid var(--card-border);
  background: var(--dark2);
  color: var(--text-muted);
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.18s ease;
  user-select: none;
}

.pill:hover {
  border-color: var(--yellow);
  color: var(--yellow);
  background: rgba(254,217,15,0.08);
}

.pill-count {
  display: inline-block;
  background: rgba(255,255,255,0.1);
  border-radius: 999px;
  padding: 1px 6px;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.pill.active-cat .pill-count {
  background: rgba(0,0,0,0.2);
}

.pill.active-cat {
  background: var(--yellow);
  border-color: var(--yellow);
  color: var(--dark);
  box-shadow: 0 0 16px rgba(254,217,15,0.4);
}

.pill.active-diff-simple { background: #4CAF50; border-color: #4CAF50; color: #fff; }
.pill.active-diff-advanced { background: var(--sky-dark); border-color: var(--sky-dark); color: #fff; }
.pill.active-diff-expert { background: var(--donut-pink); border-color: var(--donut-pink); color: #fff; }
.pill.active-diff-overengineer { background: var(--orange); border-color: var(--orange); color: #fff; }
.pill.active-diff-mistakes { background: #8B0000; border-color: #cc0000; color: #fff; }
.pill.active-diff-all { background: var(--dark3); border-color: var(--text-muted); color: var(--text); }

.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--dark3);
  border: 1.5px solid var(--card-border);
  border-radius: 999px;
  padding: 6px 14px;
  margin-top: 6px;
}

.search-bar input {
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 0.8rem;
  width: 100%;
  font-family: 'Inter', sans-serif;
}
.search-bar input::placeholder { color: var(--text-muted); }
.search-icon { color: var(--text-muted); font-size: 0.85rem; }

/* ===== MAIN CONTENT ===== */
.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}

.category-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 24px;
  padding: 20px 24px;
  background: linear-gradient(135deg, var(--card-bg) 0%, rgba(30,30,30,0.6) 100%);
  border-radius: var(--radius);
  border-left: 4px solid var(--yellow);
  box-shadow: var(--shadow);
}

.cat-icon { font-size: 2.5rem; }

.cat-info h2 {
  font-family: 'Permanent Marker', cursive;
  font-size: 1.6rem;
  color: var(--yellow);
  margin-bottom: 4px;
}

.cat-info p {
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.5;
}

.count-badge {
  margin-left: auto;
  background: var(--yellow);
  color: var(--dark);
  font-weight: 700;
  font-size: 0.75rem;
  padding: 4px 12px;
  border-radius: 999px;
  white-space: nowrap;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

.card {
  background: var(--card-bg);
  border: 1.5px solid var(--card-border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  transform: translateY(-3px);
  border-color: rgba(254,217,15,0.3);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(254,217,15,0.1);
}

.card-header {
  padding: 14px 16px 10px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border-bottom: 1px solid var(--card-border);
}

.card-num {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--yellow);
  background: rgba(254,217,15,0.12);
  padding: 2px 6px;
  border-radius: 4px;
  margin-top: 2px;
  flex-shrink: 0;
}

.card-title {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  flex: 1;
}

.diff-badge {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 2px 8px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
}

.diff-simple { background: rgba(76,175,80,0.2); color: #81C784; border: 1px solid #4CAF50; }
.diff-advanced { background: rgba(58,172,216,0.2); color: #70C8F0; border: 1px solid #3AACD8; }
.diff-expert { background: rgba(227,79,142,0.2); color: #F48FB1; border: 1px solid #E34F8E; }
.diff-overengineer { background: rgba(241,90,34,0.2); color: #FFAB76; border: 1px solid #F15A22; }
.diff-mistakes { background: rgba(139,0,0,0.3); color: #EF9A9A; border: 1px solid #cc0000; }

.card-body {
  padding: 12px 16px;
}

.why-block {
  background: rgba(254,217,15,0.06);
  border-left: 3px solid var(--yellow);
  border-radius: 0 8px 8px 0;
  padding: 8px 12px;
  margin-bottom: 10px;
  font-size: 0.78rem;
  color: var(--text-muted);
  line-height: 1.6;
}

.why-block strong {
  color: var(--yellow);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: block;
  margin-bottom: 3px;
}

.code-block {
  border-radius: 8px;
  overflow: hidden;
  font-size: 0.73rem;
  position: relative;
}

.code-lang-tag {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
  background: rgba(0,0,0,0.4);
  padding: 1px 6px;
  border-radius: 4px;
  z-index: 1;
  pointer-events: none;
}

.code-block pre {
  margin: 0 !important;
}

.code-block code {
  font-family: 'Space Mono', monospace !important;
  font-size: 0.72rem !important;
  line-height: 1.5 !important;
}

.copy-btn {
  position: absolute;
  bottom: 6px;
  right: 8px;
  background: rgba(254,217,15,0.15);
  border: 1px solid rgba(254,217,15,0.3);
  color: var(--yellow);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 0.6rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  z-index: 2;
}

.copy-btn:hover { background: rgba(254,217,15,0.3); }

.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.no-results .emoji { font-size: 3rem; margin-bottom: 12px; }
.no-results h3 { font-size: 1.1rem; color: var(--yellow); margin-bottom: 6px; }

/* ===== FOOTER ===== */
.footer {
  background: var(--dark2);
  border-top: 2px solid var(--card-border);
  padding: 24px;
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.footer a { color: var(--yellow); text-decoration: none; }
.footer .donuts { font-size: 1.5rem; margin-bottom: 8px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .cards-grid { grid-template-columns: 1fr; }
  .token-inner { grid-template-columns: 1fr; text-align: center; }
  h1 { font-size: 1.8rem; }
}

/* ===== ANIMATIONS ===== */
@keyframes fade-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.card { animation: fade-in 0.25s ease both; }
.card:nth-child(1) { animation-delay: 0.02s; }
.card:nth-child(2) { animation-delay: 0.04s; }
.card:nth-child(3) { animation-delay: 0.06s; }
.card:nth-child(4) { animation-delay: 0.08s; }
.card:nth-child(5) { animation-delay: 0.10s; }
.card:nth-child(6) { animation-delay: 0.12s; }
.card:nth-child(7) { animation-delay: 0.14s; }
.card:nth-child(8) { animation-delay: 0.16s; }

/* Springfield grass strip */
.grass-strip {
  height: 22px;
  background: linear-gradient(180deg, #4A9E2F 0%, #3A7D24 100%);
  border-top: 3px solid #5CB833;
  position: relative;
}

.grass-strip::before {
  content: '';
  position: absolute;
  top: -8px; left: 0; right: 0;
  height: 10px;
  background: radial-gradient(ellipse 20px 10px at 50% 100%, #5CB833 0%, transparent 100%);
  background-size: 40px 10px;
  background-repeat: repeat-x;
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="sky-header">
  <div class="clouds">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>
  <div class="header-content">
    <h1>The Claude Code<br>Missing Manual</h1>
    <p class="subtitle">Everything Anthropic forgot to tell you · Patterns, tricks &amp; power moves</p>
  </div>
</div>
<div class="grass-strip"></div>

<!-- ===== STICKY NAV ===== -->
<div class="sticky-nav">
  <div class="nav-row">
    <div>
      <div class="row-label">Category</div>
      <div class="pills" id="category-pills"></div>
    </div>
    <div>
      <div class="row-label">Difficulty</div>
      <div class="pills" id="difficulty-pills">
        <button class="pill active-diff-all" data-diff="all">All</button>
        <button class="pill" data-diff="simple">Simple</button>
        <button class="pill" data-diff="advanced">Advanced</button>
        <button class="pill" data-diff="expert">Expert</button>
      </div>
    </div>
    <div class="search-bar">
      <span class="search-icon">&#x2315;</span>
      <input type="text" id="search-input" placeholder="Search examples, patterns, commands…">
    </div>
  </div>
</div>

<!-- ===== MAIN ===== -->
<div class="main" id="main-content"></div>

<!-- ===== FOOTER ===== -->
<div class="footer">
  <p>The Claude Code Missing Manual &mdash; Community-powered patterns &amp; power moves</p>
  <p style="margin-top:6px"><a href="https://docs.anthropic.com/en/docs/claude-code">Claude Code Docs</a> · <a href="https://github.com/anthropics/claude-code">GitHub</a> · Built for Springfield, deployed everywhere</p>
</div>

<script>
// CATEGORIES is a plain global — NOT reactive.
// Alpine only proxies the 3 scalar state values in app(), keeping startup fast on mobile.
const CATEGORIES = {

      // ===================================================
      // 1. LOOPS
      // ===================================================
      loops: {
        icon: '🔄',
        title: 'Loops',
        description: 'Recurring tasks, polling, and long-running workflows using /loop and shell patterns. Keep Claude working while you sleep.',
        examples: [
          {
            title: 'Basic /loop — poll every 10 minutes',
            difficulty: 'simple',
            why: 'The built-in /loop skill runs a slash command on an interval. Set it and forget it — Claude wakes up, checks state, acts, sleeps.',
            lang: 'bash',
            code: `/loop 10m /status-check
# Runs /status-check every 10 minutes until you stop it`
          },
          {
            title: 'Loop until tests pass',
            difficulty: 'simple',
            why: 'Instead of babysitting CI yourself, tell Claude to keep iterating until tests go green. The loop stops when you hit the exit condition.',
            lang: 'bash',
            code: `/loop 2m until tests pass: run npm test, if failing fix the first error then stop`
          },
          {
            title: 'Exponential backoff loop',
            difficulty: 'advanced',
            why: 'Avoid hammering APIs or services. Backoff prevents rate-limit errors that cause the entire workflow to fail.',
            lang: 'bash',
            code: `# CLAUDE.md snippet — teach Claude this pattern:
# Retry with exponential backoff
for i in 1 2 3 4; do
  if command_that_might_fail; then
    break
  fi
  sleep $((2 ** i))
done`
          },
          {
            title: 'CI babysitting loop',
            difficulty: 'simple',
            why: 'Subscribe to PR events and let Claude monitor CI. When a check fails, Claude diagnoses and pushes a fix automatically.',
            lang: 'bash',
            code: `/loop 5m check CI on PR #42 — if red, read the failure log and push a fix`
          },
          {
            title: 'Deploy monitoring loop',
            difficulty: 'advanced',
            why: 'After a deploy, you want real-time signal. This loop pings a health endpoint and alerts on degradation without you watching a dashboard.',
            lang: 'bash',
            code: `/loop 1m curl https://api.myapp.com/health | jq .status
# If status != "ok", create a GitHub issue with the response body`
          },
          {
            title: 'Rate-limited loop (stay under API quotas)',
            difficulty: 'advanced',
            why: 'When processing many items, a naive loop exhausts rate limits. Add a sleep between batches to stay in quota.',
            lang: 'bash',
            code: `# Process 100 files, 10 at a time, with a pause between batches
for batch in $(seq 0 10 99); do
  process_files $batch $((batch+9))
  sleep 60  # respect 1 req/min limit
done`
          },
          {
            title: 'Loop with state file',
            difficulty: 'advanced',
            why: 'Loops that restart from the beginning waste tokens. A state file lets you resume from where you left off — essential for 24-hour runs.',
            lang: 'bash',
            code: `# Claude reads/writes .loop-state.json each iteration
# {\"last_processed\": 42, \"errors\": [], \"started\": \"2024-01-15\"}
STATE=$(cat .loop-state.json 2>/dev/null || echo '{}')
LAST=$(echo $STATE | jq .last_processed // 0)
# process from $LAST onward, then update the file`
          },
          {
            title: 'Slack webhook alert from loop',
            difficulty: 'advanced',
            why: 'A loop that fails silently is worse than no loop. Wire in a Slack webhook so you get a ping on your phone when something goes wrong.',
            lang: 'bash',
            code: `# In your hook or loop body:
curl -X POST $SLACK_WEBHOOK_URL \
  -H 'Content-type: application/json' \
  -d '{"text": "⚠️ Loop alert: deploy failed at step 3"}'`
          },
          {
            title: 'Nested loop — outer retry, inner task',
            difficulty: 'expert',
            why: 'Some workflows need two levels: retry the whole task on transient failure, but step through sub-tasks in order. Nesting gives you both.',
            lang: 'bash',
            code: `for attempt in 1 2 3; do
  success=true
  for step in lint test build deploy; do
    claude "run $step step" || { success=false; break; }
  done
  $success && break
  echo "Attempt $attempt failed, retrying..."
  sleep $((attempt * 30))
done`
          },
          {
            title: 'Cron-style scheduling',
            difficulty: 'advanced',
            why: 'GitHub Actions cron is overkill for quick tasks. Run a loop on a cloud VM or GitHub Codespace that wakes Claude at a fixed schedule.',
            lang: 'yaml',
            code: `# .github/workflows/nightly.yml
on:
  schedule:
    - cron: '0 2 * * *'   # 2am UTC daily
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx claude "run nightly data sync and commit results"`
          },
          {
            title: 'Loop with cost guard',
            difficulty: 'expert',
            why: 'Runaway loops burn money. Track cumulative token spend in a state file and kill the loop if it crosses a threshold.',
            lang: 'javascript',
            code: `// In your loop body, check accumulated cost
const state = JSON.parse(fs.readFileSync('.loop-state.json', 'utf8'));
if (state.totalTokens > 500_000) {
  console.error('Cost guard triggered — stopping loop');
  process.exit(1);
}
state.totalTokens += response.usage.input_tokens + response.usage.output_tokens;
fs.writeFileSync('.loop-state.json', JSON.stringify(state));`
          },
          {
            title: 'Loop with git auto-commit checkpoint',
            difficulty: 'advanced',
            why: 'Long loops should commit progress so a crash does not lose work. Each iteration is a checkpoint you can roll back to.',
            lang: 'bash',
            code: `/loop 15m do the next batch of migration tasks, then git add -A && git commit -m "loop checkpoint $(date +%H:%M)"`
          },
          {
            title: 'Watch a directory for new files',
            difficulty: 'simple',
            why: 'A directory watcher trigger gives you near-instant reactivity without polling overhead. Great for ETL drop zones and upload processors.',
            lang: 'bash',
            code: `inotifywait -m -e close_write ./uploads/ |
while read dir event file; do
  claude "Process new file: $dir$file. Validate, transform, upload to S3."
done`
          },
          {
            title: 'Convergence loop — until no more changes',
            difficulty: 'advanced',
            why: 'Some operations need to run repeatedly until the system stabilizes (e.g. import resolution, formatter passes). Stop when the diff is empty.',
            lang: 'bash',
            code: `while true; do
  BEFORE=$(git diff | sha256sum)
  claude "fix any remaining lint errors"
  AFTER=$(git diff | sha256sum)
  [ "$BEFORE" = "$AFTER" ] && break
done
echo "Converged after iterations"`
          },
          {
            title: 'Loop with progress bar in terminal',
            difficulty: 'advanced',

  constructor(threshold = 3, timeout = 30000) {
    this.failures = 0;
    this.threshold = threshold;
    this.timeout = timeout;
    this.state = 'closed'; // closed=normal, open=failing, half-open=testing
    this.nextAttempt = 0;
  }
  async call(fn) {
    if (this.state === 'open') {
      if (Date.now() < this.nextAttempt) throw new Error('Circuit open');
      this.state = 'half-open';
    }
    try {
      const result = await fn();
      this.reset();
      return result;
    } catch (e) {
      this.failure();
      throw e;
    }
  }
  failure() { this.failures++; if (this.failures >= this.threshold) { this.state='open'; this.nextAttempt=Date.now()+this.timeout; } }
  reset() { this.failures=0; this.state='closed'; }
}`

  let last = 0;
  return ((...args: unknown[]) => {
    const now = Date.now();
    if (now - last >= ms) { last = now; fn(...args); }
  }) as unknown as F;
}
function debounce<F extends Function>(fn: F, ms: number): F {
  let t: ReturnType<typeof setTimeout>;
  return ((...args: unknown[]) => {
    clearTimeout(t);

- Throws on invalid input
Use Jest. Don't write the implementation yet."`
          },
          {
            title: 'Generate tests from a function signature',
            difficulty: 'simple',
            why: 'Claude can infer edge cases from a type signature that humans miss. Give it the function and ask for comprehensive coverage.',
            lang: 'bash',
            code: `"Read src/utils/pricing.ts. For the calculateDiscount function, write Jest tests covering:
- Happy path
- Zero quantity
- Negative price
- Quantity above max threshold
- Non-integer quantities
- Each discount tier boundary"`
          },
          {
            title: 'Find untested branches and fill them',
            difficulty: 'simple',
            why: 'Instead of chasing a coverage number, ask Claude to read the code and identify which branches have no tests. More targeted than a coverage report.',
            lang: 'bash',
            code: `"Read src/auth/session.ts and src/__tests__/session.test.ts.
List every if/else branch or throw statement in session.ts that has no corresponding test.
Then write the missing tests. Don't modify session.ts."`
          },
          {
            title: 'Run tests, read failures, fix, repeat',
            difficulty: 'simple',
            why: 'The fastest way to fix a broken test suite. Give Claude the test runner command and let it iterate.',
            lang: 'bash',
            code: `/loop 2m run npm test -- --bail; if any test fails, read the failure output and fix only the first failing test, then stop`
          },
          {
            title: 'Write a property-based test',
            difficulty: 'advanced',
            why: 'Property tests find edge cases that example tests miss. They\'re especially powerful for parsers, formatters, and data transformations.',
            lang: 'typescript',
            code: `// Ask Claude: "Write a fast-check property test for our JSON serializer
// that verifies round-trip fidelity for arbitrary objects"
import fc from 'fast-check';
import { serialize, deserialize } from '../src/serializer';

test('round-trip fidelity', () => {
  fc.assert(
    fc.property(fc.jsonValue(), value => {
      expect(deserialize(serialize(value))).toEqual(value);
    })
  );
});`
          },
          {
            title: 'Debug a flaky test',
            difficulty: 'advanced',
            why: 'Flaky tests are expensive to chase manually. Claude can read the test, the implementation, and the failure logs to identify race conditions or shared state.',
            lang: 'bash',
            code: `"This test fails roughly 1 in 10 runs. Read the test at src/__tests__/queue.test.ts and the implementation at src/queue.ts. The failure message is:
  'Expected 3, received 2'
Identify why it's flaky and fix it without changing the test assertions."`
          },
          {
            title: 'Generate test fixtures from real data shapes',
            difficulty: 'simple',
            why: 'Realistic fixtures expose bugs that toy data doesn\'t. Ask Claude to create fixtures that match your actual API response shapes.',
            lang: 'bash',
            code: `"Read the API response type in src/types/stripe.ts.
Create a src/__fixtures__/stripe.ts file with 3 realistic test fixtures:
1. A successful charge
2. A failed charge (card_declined)
3. A disputed charge
All fields must have realistic values, not 'test' or 'foo'."`
          },
          {
            title: 'Snapshot test for a UI component',
            difficulty: 'simple',
            why: 'Snapshot tests catch unintended rendering changes. Claude can write them faster than you can, and update them when intentional changes happen.',
            lang: 'typescript',
            code: `// Ask: "Write a React Testing Library snapshot test for the UserCard component.
// Include one snapshot for a verified user and one for an unverified user."
import { render } from '@testing-library/react';
import { UserCard } from '../UserCard';

it('renders verified user', () => {
  const { container } = render(<UserCard user={{ name: 'Alice', verified: true }} />);
  expect(container).toMatchSnapshot();
});`
          },
          {
            title: 'Contract test between two services',
            difficulty: 'expert',
            why: 'Integration tests are brittle. Contract tests verify that producer and consumer agree on the API shape, without needing both services running.',
            lang: 'typescript',
            code: `// Ask Claude: "Write a Pact contract test between our frontend and the /users endpoint.
// The consumer expects: { id: string, email: string, role: 'admin' | 'user' }"
import { Pact } from '@pact-foundation/pact';

const provider = new Pact({ consumer: 'frontend', provider: 'users-api' });

describe('GET /users/:id', () => {
  it('returns user shape', async () => {
    await provider.addInteraction({
      state: 'user exists',
      uponReceiving: 'a request for a user',
      withRequest: { method: 'GET', path: '/users/1' },
      willRespondWith: {
        status: 200,
        body: { id: like('abc'), email: like('a@b.com'), role: term({ generate: 'admin', matcher: 'admin|user' }) }
      }
    });
  });
});`
          },
          {
            title: 'Ask Claude to review your tests for gaps',
            difficulty: 'advanced',
            why: 'Claude can act as a test reviewer — pointing out missing assertions, weak matchers, and tests that would pass even if the implementation was wrong.',
            lang: 'bash',
            code: `"Review the tests in src/__tests__/billing.test.ts as a skeptical QA engineer.
For each test, tell me:
1. Would this test catch a bug in the happy path?
2. Is any assertion so weak it would pass even if the function was broken?
3. What scenario is NOT tested that could cause a production bug?
Do not rewrite the tests — just report your findings."`
          },
          {
            title: 'Generate load test scenarios',
            difficulty: 'expert',
            why: 'Load tests are often written once and never updated. Claude can generate realistic k6 or artillery scripts from your API spec.',
            lang: 'javascript',
            code: `// Ask: "Write a k6 load test for our checkout API.
// Ramp from 10 to 200 VUs over 2 minutes, hold for 3 minutes.
// Mix: 70% browse, 20% add-to-cart, 10% checkout."
import http from 'k6/http';
import { sleep, check } from 'k6';

export const options = {
  stages: [
    { duration: '2m', target: 200 },
    { duration: '3m', target: 200 },
    { duration: '30s', target: 0 },
  ],
};

export default function () {
  const r = http.get('https://api.myshop.com/products');
  check(r, { 'status 200': res => res.status === 200 });
  sleep(Math.random() * 2);
}`
          },
          {
            title: 'Mutation testing — kill surviving mutants',
            difficulty: 'expert',
            why: 'Mutation testing reveals tests that pass even when the code is wrong. Claude can read Stryker output and write the targeted tests that kill survivors.',
            lang: 'bash',
            code: `# Run Stryker first:
npx stryker run

# Then paste surviving mutants to Claude:
"These mutations survived (tests didn't catch them):
- Line 42: changed > to >= in the discount threshold check
- Line 87: removed the null guard before user.email

Write specific tests that would catch each mutation. Be minimal — one test per mutant."`
          },
        ]
      },

}; // end CATEGORIES

// ── State ──────────────────────────────────────────────────────────────────
let activeCategory  = 'loops';
let activeDifficulty = 'all';
let searchQuery     = '';

// ── Helpers ────────────────────────────────────────────────────────────────
const DIFF_LABELS = { simple:'Simple', advanced:'Advanced', expert:'Expert', overengineer:'Over-Engineer', mistakes:'Avoid' };
const DIFF_ACTIVE = { all:'active-diff-all', simple:'active-diff-simple', advanced:'active-diff-advanced', expert:'active-diff-expert', overengineer:'active-diff-overengineer', mistakes:'active-diff-mistakes' };

function hl(code, lang) {
  try { return hljs.highlight(code.trim(), { language: lang }).value; }
  catch(e) {
    try { return hljs.highlightAuto(code.trim()).value; }
    catch(e2) { return code.trim().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  }
}

function escAttr(s) { return String(s).replace(/"/g,'&quot;'); }

// ── Render category pills ──────────────────────────────────────────────────
function renderCategoryPills() {
  const el = document.getElementById('category-pills');
  el.innerHTML = Object.entries(CATEGORIES).map(([id, c]) =>
    `<button class="pill${activeCategory === id ? ' active-cat' : ''}" data-cat="${id}">${c.icon} ${c.title} <span class="pill-count">${c.examples.length}</span></button>`
  ).join('');
}

// ── Render difficulty pills ────────────────────────────────────────────────
function renderDiffPills() {
  document.querySelectorAll('#difficulty-pills .pill').forEach(btn => {
    const d = btn.dataset.diff;
    btn.className = 'pill' + (activeDifficulty === d ? ' ' + DIFF_ACTIVE[d] : '');
  });
}

// ── Render main content ────────────────────────────────────────────────────
function renderContent() {
  const main = document.getElementById('main-content');
  const cat = CATEGORIES[activeCategory];
  if (!cat) { main.innerHTML = ''; return; }

  let examples = cat.examples;
  if (activeDifficulty !== 'all') examples = examples.filter(e => e.difficulty === activeDifficulty);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    examples = examples.filter(e =>
      e.title.toLowerCase().includes(q) || e.why.toLowerCase().includes(q) || e.code.toLowerCase().includes(q)
    );
  }

  const header = `
    <div class="category-header">
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-info">
        <h2>${cat.title}</h2>
        <p>${cat.description}</p>
      </div>
      <div class="count-badge">${examples.length} examples</div>
    </div>`;

  const noResults = examples.length === 0
    ? `<div class="no-results"><h3>No examples match your filters</h3><p>Try a different difficulty level or clear your search.</p></div>`
    : '';

  const cards = examples.map((ex, idx) => `
    <div class="card">
      <div class="card-header">
        <div class="card-num">${String(idx+1).padStart(2,'0')}</div>
        <div class="card-title">${ex.title}</div>
        <div class="diff-badge diff-${ex.difficulty}">${DIFF_LABELS[ex.difficulty] || ex.difficulty}</div>
      </div>
      <div class="card-body">
        <div class="why-block"><strong>Why this matters</strong><span>${ex.why}</span></div>
        <div class="code-block" style="position:relative">
          <div class="code-lang-tag">${ex.lang || 'bash'}</div>
          <pre><code class="language-${ex.lang||'bash'}">${hl(ex.code, ex.lang||'bash')}</code></pre>
          <button class="copy-btn" data-code="${escAttr(ex.code)}">COPY</button>
        </div>
      </div>
    </div>`).join('');

  main.innerHTML = header + noResults + `<div class="cards-grid">${cards}</div>`;
}

// ── Wire up events ─────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  hljs.configure({ ignoreUnescapedHTML: true });

  // Category pills (delegated — pills are dynamically rendered)
  document.getElementById('category-pills').addEventListener('click', e => {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    activeCategory = btn.dataset.cat;
    renderCategoryPills();
    renderContent();
  });

  // Difficulty pills — clicking the active pill deselects back to "all"
  document.getElementById('difficulty-pills').addEventListener('click', e => {
    const btn = e.target.closest('[data-diff]');
    if (!btn) return;
    const d = btn.dataset.diff;
    activeDifficulty = (activeDifficulty === d && d !== 'all') ? 'all' : d;
    renderDiffPills();
    renderContent();
  });

  // Search
  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value;
    renderContent();
  });

  // Copy buttons (delegated)
  document.getElementById('main-content').addEventListener('click', e => {
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    navigator.clipboard.writeText(btn.dataset.code.trim()).then(() => {
      btn.textContent = 'COPIED!';
      setTimeout(() => btn.textContent = 'COPY', 1500);
    });
  });

  // Initial render
  renderCategoryPills();
  renderDiffPills();
  renderContent();
});
</script>
