<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Claude Code Missing Manual</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root {
  --yellow: #FED90F;
  --yellow-dark: #E8C400;
  --yellow-pale: #FFF9D6;
  --sky: #70C8F0;
  --sky-dark: #3AACD8;
  --donut-pink: #E34F8E;
  --donut-glaze: #F5B8D2;
  --springfield-blue: #1B4F8A;
  --orange: #F15A22;
  --green: #4A9E2F;
  --green-pale: #E8F5E0;
  --skin: #FFD5B4;
  --dark: #111111;
  --dark2: #1C1C1C;
  --dark3: #2A2A2A;
  --card-bg: #1E1E1E;
  --card-border: #333333;
  --text: #EFEFEF;
  --text-muted: #9A9A9A;
  --code-bg: #0A0A0A;
  --radius: 14px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== SPRINGFIELD SKY HEADER ===== */
.sky-header {
  background: linear-gradient(180deg, #1B4F8A 0%, #2E7DD6 40%, #70C8F0 80%, #A8DFF0 100%);
  padding: 0;
  position: relative;
  overflow: hidden;
}

.clouds {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
}

.cloud {
  position: absolute;
  background: rgba(255,255,255,0.85);
  border-radius: 50px;
  filter: blur(1px);
}
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: inherit;
  border-radius: 50%;
}
.cloud-1 { width: 120px; height: 35px; top: 15%; left: 5%; animation: drift 18s linear infinite; }
.cloud-1::before { width: 60px; height: 55px; top: -30px; left: 15px; }
.cloud-1::after { width: 50px; height: 45px; top: -20px; right: 15px; }
.cloud-2 { width: 160px; height: 40px; top: 30%; left: 60%; animation: drift 25s linear infinite reverse; }
.cloud-2::before { width: 80px; height: 60px; top: -35px; left: 20px; }
.cloud-2::after { width: 60px; height: 50px; top: -25px; right: 20px; }
.cloud-3 { width: 90px; height: 28px; top: 55%; left: 30%; animation: drift 20s linear infinite; }
.cloud-3::before { width: 45px; height: 40px; top: -22px; left: 10px; }
.cloud-3::after { width: 38px; height: 35px; top: -18px; right: 10px; }

@keyframes drift {
  0% { transform: translateX(-200px); }
  100% { transform: translateX(calc(100vw + 200px)); }
}

.header-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 48px 24px 32px;
}

.donut-row {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 16px;
  font-size: 2.2rem;
  animation: bounce-donuts 2s ease-in-out infinite alternate;
}

@keyframes bounce-donuts {
  from { transform: translateY(0); }
  to { transform: translateY(-8px); }
}

h1 {
  font-family: 'Permanent Marker', cursive;
  font-size: clamp(2rem, 6vw, 4rem);
  color: var(--yellow);
  text-shadow: 3px 3px 0 var(--springfield-blue), 5px 5px 0 rgba(0,0,0,0.3);
  line-height: 1.1;
  margin-bottom: 8px;
  letter-spacing: -1px;
}

.subtitle {
  font-family: 'Permanent Marker', cursive;
  font-size: clamp(0.9rem, 2.5vw, 1.3rem);
  color: #FFF;
  text-shadow: 1px 1px 0 var(--springfield-blue);
  margin-bottom: 24px;
  opacity: 0.95;
}

/* ===== STICKY NAV ===== */
.sticky-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(17,17,17,0.97);
  backdrop-filter: blur(12px);
  border-bottom: 2px solid var(--card-border);
  padding: 8px 16px 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.nav-row {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.row-label {
  font-size: 0.58rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.pills {
  display: flex;
  gap: 6px;
  flex-wrap: nowrap;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.pills::-webkit-scrollbar { display: none; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 11px;
  border-radius: 999px;
  border: 1.5px solid var(--card-border);
  background: var(--dark2);
  color: var(--text-muted);
  font-size: 0.7rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.18s ease;
  user-select: none;
}

.pill:hover {
  border-color: var(--yellow);
  color: var(--yellow);
  background: rgba(254,217,15,0.08);
}

.pill-count {
  display: inline-block;
  background: rgba(255,255,255,0.1);
  border-radius: 999px;
  padding: 1px 5px;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.pill.active-cat .pill-count {
  background: rgba(0,0,0,0.2);
}

/* ===== Get Certified Button ===== */
.cert-btn {
  margin-top: 14px;
  background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-dark) 100%);
  color: #1a1a1a;
  border: 2px solid #1a1a1a;
  border-radius: 999px;
  padding: 7px 18px;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  cursor: pointer;
  box-shadow: 0 3px 0 #1a1a1a, 0 5px 12px rgba(0,0,0,0.2);
  transition: all 0.18s ease;
  font-family: inherit;
  text-transform: uppercase;
}
.cert-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 0 #1a1a1a, 0 8px 14px rgba(0,0,0,0.25);
}
.cert-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #1a1a1a, 0 3px 8px rgba(0,0,0,0.15);
}

/* ===== Two-row category pill layout ===== */
.pills-rows { display: flex; flex-direction: column; gap: 4px; }
.pills-row { display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.pills-row::-webkit-scrollbar { display: none; }

/* ===== Try-it panel ===== */
.try-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  background: transparent;
  color: var(--yellow);
  border: 1.5px solid var(--yellow);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.18s ease;
  font-family: inherit;
}
.try-btn:hover {
  background: var(--yellow);
  color: #1a1a1a;
}
.try-panel {
  display: none;
  margin-top: 12px;
  padding: 14px;
  background: rgba(254,217,15,0.04);
  border: 1px dashed rgba(254,217,15,0.4);
  border-radius: 10px;
}
.try-panel.open { display: block; }
.try-panel-label {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--yellow);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}
.try-editor {
  width: 100%;
  min-height: 100px;
  padding: 10px;
  background: #0d1117;
  color: #e6edf3;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  font-family: 'Space Mono', monospace;
  font-size: 0.78rem;
  line-height: 1.55;
  resize: vertical;
  box-sizing: border-box;
}
.try-run-btn {
  margin-top: 8px;
  background: var(--yellow);
  color: #1a1a1a;
  border: 2px solid #1a1a1a;
  border-radius: 999px;
  padding: 6px 18px;
  font-size: 0.75rem;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  text-transform: uppercase;
}
.try-run-btn:hover { background: var(--yellow-dark); }
.try-output {
  margin-top: 10px;
  padding: 12px;
  background: #0a0e14;
  color: #b8d4a0;
  border-left: 3px solid #5CB833;
  border-radius: 4px;
  font-family: 'Space Mono', monospace;
  font-size: 0.78rem;
  line-height: 1.55;
  white-space: pre-wrap;
  word-wrap: break-word;
  min-height: 30px;
  display: none;
}
.try-output.shown { display: block; }
.try-output.empty { color: #888; font-style: italic; }

/* ===== Quiz ===== */
.cert-quiz-section {
  max-width: 800px;
  margin: 60px auto 40px;
  padding: 30px;
  background: var(--dark2);
  border: 3px solid var(--yellow);
  border-radius: 24px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.cert-quiz-header {
  text-align: center;
  margin-bottom: 30px;
}
.cert-quiz-header h2 {
  font-family: 'Permanent Marker', cursive;
  color: var(--yellow);
  font-size: 2.2rem;
  margin: 0 0 10px;
}
.cert-quiz-header p {
  color: var(--text-muted);
  font-size: 0.95rem;
  margin: 0;
}
.cert-progress {
  text-align: center;
  margin: 16px 0;
  font-weight: 700;
  color: var(--yellow);
  font-size: 0.9rem;
}
.cert-q {
  margin-bottom: 24px;
  padding: 18px;
  background: rgba(0,0,0,0.25);
  border-radius: 12px;
  border-left: 4px solid var(--sky-dark);
}
.cert-q-num {
  display: inline-block;
  background: var(--sky-dark);
  color: #fff;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: 0.05em;
}
.cert-q-text {
  font-weight: 600;
  font-size: 1.02rem;
  margin-bottom: 14px;
  color: var(--text);
}
.cert-options { display: flex; flex-direction: column; gap: 8px; }
.cert-option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px;
  background: var(--dark);
  border: 1.5px solid var(--card-border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s ease;
  color: var(--text);
  font-size: 0.9rem;
  text-align: left;
  font-family: inherit;
}
.cert-option:hover { border-color: var(--yellow); }
.cert-option.selected { border-color: var(--yellow); background: rgba(254,217,15,0.08); }
.cert-option.correct { border-color: #4CAF50; background: rgba(76,175,80,0.15); color: #C5E1A5; }
.cert-option.wrong { border-color: #cc3344; background: rgba(204,51,68,0.15); color: #FFAB91; }
.cert-option-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  font-weight: 700;
  font-size: 0.8rem;
  flex-shrink: 0;
}
.cert-option.correct .cert-option-letter { background: #4CAF50; color: #fff; }
.cert-option.wrong .cert-option-letter { background: #cc3344; color: #fff; }
.cert-submit {
  margin-top: 12px;
  background: var(--yellow);
  color: #1a1a1a;
  border: 2px solid #1a1a1a;
  border-radius: 999px;
  padding: 8px 22px;
  font-size: 0.78rem;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  text-transform: uppercase;
}
.cert-submit:disabled { opacity: 0.4; cursor: not-allowed; }
.cert-explanation {
  display: none;
  margin-top: 14px;
  padding: 12px 14px;
  background: rgba(112,200,240,0.08);
  border-left: 3px solid var(--sky);
  border-radius: 6px;
  color: var(--text);
  font-size: 0.88rem;
  line-height: 1.55;
}
.cert-explanation.shown { display: block; }
.cert-explanation strong { color: var(--sky); }
.cert-final {
  display: none;
  text-align: center;
  margin-top: 30px;
  padding: 26px;
  background: linear-gradient(135deg, rgba(254,217,15,0.12) 0%, rgba(112,200,240,0.12) 100%);
  border: 2px solid var(--yellow);
  border-radius: 16px;
}
.cert-final.shown { display: block; }
.cert-final h3 {
  margin: 0 0 10px;
  font-family: 'Permanent Marker', cursive;
  font-size: 1.8rem;
  color: var(--yellow);
}
.cert-final-score { font-size: 1.4rem; font-weight: 800; margin: 10px 0; }

.pill.active-cat {
  background: var(--yellow);
  border-color: var(--yellow);
  color: var(--dark);
  box-shadow: 0 0 16px rgba(254,217,15,0.4);
}

.pill.active-diff-essential { background: #4CAF50; border-color: #4CAF50; color: #fff; }
.pill.active-diff-advanced { background: var(--sky-dark); border-color: var(--sky-dark); color: #fff; }
.pill.active-diff-overengineer { background: var(--orange); border-color: var(--orange); color: #fff; }
.pill.active-diff-mistakes { background: #8B0000; border-color: #cc0000; color: #fff; }
.pill.active-diff-all { background: var(--dark3); border-color: var(--text-muted); color: var(--text); }

.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--dark3);
  border: 1.5px solid var(--card-border);
  border-radius: 999px;
  padding: 6px 14px;
  margin-top: 6px;
}

.search-bar input {
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 0.8rem;
  width: 100%;
  font-family: 'Inter', sans-serif;
}
.search-bar input::placeholder { color: var(--text-muted); }
.search-icon { color: var(--text-muted); font-size: 0.85rem; }

/* ===== MAIN CONTENT ===== */
.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}

.category-header {
  margin-bottom: 24px;
  padding: 20px 24px;
  background: linear-gradient(135deg, var(--card-bg) 0%, rgba(30,30,30,0.6) 100%);
  border-radius: var(--radius);
  border-left: 4px solid var(--yellow);
  box-shadow: var(--shadow);
}

.cat-info {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.title-count {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.cat-info h2 {
  font-family: 'Permanent Marker', cursive;
  font-size: 1.6rem;
  color: var(--yellow);
  margin: 0;
}

.cat-info p {
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.5;
  margin: 0;
  max-width: none;
}

.count-badge {
  background: var(--yellow);
  color: var(--dark);
  font-weight: 700;
  font-size: 0.75rem;
  padding: 4px 12px;
  border-radius: 999px;
  white-space: nowrap;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

.card {
  background: var(--card-bg);
  border: 1.5px solid var(--card-border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  transform: translateY(-3px);
  border-color: rgba(254,217,15,0.3);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(254,217,15,0.1);
}

.card-header {
  padding: 14px 16px 10px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border-bottom: 1px solid var(--card-border);
}

.card-num {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--yellow);
  background: rgba(254,217,15,0.12);
  padding: 2px 6px;
  border-radius: 4px;
  margin-top: 2px;
  flex-shrink: 0;
}

.card-title {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  flex: 1;
}

.diff-badge {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 2px 8px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
}

.diff-essential { background: rgba(76,175,80,0.2); color: #81C784; border: 1px solid #4CAF50; }
.diff-advanced { background: rgba(58,172,216,0.2); color: #70C8F0; border: 1px solid #3AACD8; }
.diff-overengineer { background: rgba(241,90,34,0.2); color: #FFAB76; border: 1px solid #F15A22; }
.diff-mistakes { background: rgba(139,0,0,0.3); color: #EF9A9A; border: 1px solid #cc0000; }

/* ===== Claude prompt block ===== */
.prompt-block {
  position: relative;
  margin-bottom: 14px;
  padding: 12px 14px 12px 16px;
  background: rgba(112,200,240,0.07);
  border-left: 3px solid var(--sky);
  border-radius: 0 8px 8px 0;
}
.prompt-block-label {
  display: block;
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--sky);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}
.prompt-text {
  font-size: 0.88rem;
  color: var(--text);
  line-height: 1.6;
  white-space: pre-wrap;
  word-wrap: break-word;
  padding-right: 70px;
}
.prompt-copy-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 0.65rem;
  padding: 3px 10px;
  border: 1.5px solid var(--sky);
  background: transparent;
  color: var(--sky);
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 700;
  white-space: nowrap;
}
.prompt-copy-btn:hover { background: var(--sky); color: #111; }

.card-body {
  padding: 12px 16px;
}

.why-block {
  background: rgba(254,217,15,0.06);
  border-left: 3px solid var(--yellow);
  border-radius: 0 8px 8px 0;
  padding: 8px 12px;
  margin-bottom: 10px;
  font-size: 0.78rem;
  color: var(--text-muted);
  line-height: 1.6;
}

.why-block strong {
  color: var(--yellow);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: block;
  margin-bottom: 3px;
}

.code-block {
  border-radius: 8px;
  overflow: hidden;
  font-size: 0.73rem;
  position: relative;
}

.code-lang-tag {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
  background: rgba(0,0,0,0.4);
  padding: 1px 6px;
  border-radius: 4px;
  z-index: 1;
  pointer-events: none;
}

.code-block pre {
  margin: 0 !important;
}

.code-block code {
  font-family: 'Space Mono', monospace !important;
  font-size: 0.72rem !important;
  line-height: 1.5 !important;
}

.copy-btn {
  position: absolute;
  bottom: 6px;
  right: 8px;
  background: rgba(254,217,15,0.15);
  border: 1px solid rgba(254,217,15,0.3);
  color: var(--yellow);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 0.6rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  z-index: 2;
}

.copy-btn:hover { background: rgba(254,217,15,0.3); }

.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.no-results .emoji { font-size: 3rem; margin-bottom: 12px; }
.no-results h3 { font-size: 1.1rem; color: var(--yellow); margin-bottom: 6px; }

/* ===== FOOTER ===== */
.footer {
  background: var(--dark2);
  border-top: 2px solid var(--card-border);
  padding: 24px;
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.footer a { color: var(--yellow); text-decoration: none; }
.footer .donuts { font-size: 1.5rem; margin-bottom: 8px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .cards-grid { grid-template-columns: 1fr; }
  .token-inner { grid-template-columns: 1fr; text-align: center; }
  h1 { font-size: 1.8rem; }
}

/* ===== ANIMATIONS ===== */
@keyframes fade-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.card { animation: fade-in 0.25s ease both; }

            code: `class CircuitBreaker {
  constructor(threshold = 3, timeout = 30000) {
    this.failures = 0;
    this.threshold = threshold;
    this.timeout = timeout;
    this.state = 'closed'; // closed=normal, open=failing, half-open=testing
    this.nextAttempt = 0;
  }
  async call(fn) {
    if (this.state === 'open') {
      if (Date.now() < this.nextAttempt) throw new Error('Circuit open');
      this.state = 'half-open';
    }
    try {
      const result = await fn();
      this.reset();
      return result;
    } catch (e) {
      this.failure();
      throw e;
    }
  }
  failure() { this.failures++; if (this.failures >= this.threshold) { this.state='open'; this.nextAttempt=Date.now()+this.timeout; } }
  reset() { this.failures=0; this.state='closed'; }
}`

            code: `function throttle<F extends Function>(fn: F, ms: number): F {
  let last = 0;
  return ((...args: unknown[]) => {
    const now = Date.now();
    if (now - last >= ms) { last = now; fn(...args); }
  }) as unknown as F;
}
function debounce<F extends Function>(fn: F, ms: number): F {
  let t: ReturnType<typeof setTimeout>;
  return ((...args: unknown[]) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  }) as unknown as F;
}`

let activeCategory  = 'loops';

// ── Helpers ────────────────────────────────────────────────────────────────
const DIFF_LABELS = { essential:'Essential', advanced:'Advanced' };
const DIFF_ACTIVE = { all:'active-diff-all', essential:'active-diff-essential', advanced:'active-diff-advanced' };

function hl(code, lang) {
  try { return hljs.highlight(code.trim(), { language: lang }).value; }
  catch(e) {
    try { return hljs.highlightAuto(code.trim()).value; }
    catch(e2) { return code.trim().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  }
}

function escAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escText(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getPrompt(ex) {
  if (ex.prompt) return ex.prompt;
  // Code that IS already a natural-language Claude prompt
  if (ex.lang === 'bash' || ex.lang === 'text') {
    const t = ex.code.trim();
    const firstLine = t.split('\n')[0];
    if (/^["\/]/.test(firstLine) && t.length < 400 && !/^#!/.test(t)) return t;
  }
  // Derive from title + first sentence of why
  const sentence = ex.why.split(/(?<=[.!?])\s/)[0].trim();
  return `${ex.title}.\n${sentence}`;
}

// ── Chain card renderer ────────────────────────────────────────────────────
function renderChainCard(ex, idx) {
  const resources = ex.resources && ex.resources.length
    ? `<div class="chain-resources">
        <span class="chain-resources-label">📎 Resources you'll need</span>
        <ul>${ex.resources.map(r => `<li>${escText(r)}</li>`).join('')}</ul>
       </div>`
    : '';

  const steps = ex.steps.map((step, si) => `
    ${si > 0 ? '<div class="chain-connector"></div>' : ''}
    <div class="chain-step">
      <div class="step-num">${si + 1}</div>
      <div class="step-body">
        <div class="step-cat-badge">${step.icon} ${step.category}</div>
        <div class="step-prompt-text">${escText(step.prompt)}</div>
      </div>
      <button class="copy-btn copy-step-btn" data-code="${escAttr(step.prompt)}">COPY</button>
    </div>`).join('');

  const allPrompts = escAttr(JSON.stringify(ex.steps.map(s => s.prompt)));

  return `<div class="card">
    <div class="card-header">
      <div class="card-num">${String(idx + 1).padStart(2, '0')}</div>
      <div class="card-title">${ex.title}</div>
      <div class="diff-badge diff-${ex.difficulty}">${DIFF_LABELS[ex.difficulty] || ex.difficulty}</div>
    </div>
    <div class="card-body">
      <div class="why-block"><strong>Goal</strong><span>${ex.why}</span></div>
      ${resources}
      <div class="chain-steps">${steps}</div>
      <button class="copy-all-btn" data-prompts="${allPrompts}">⬆ Copy All Prompts in Sequence</button>
      <button class="chain-run-btn" data-chain-run="${idx}">▶ Simulate full chain run</button>
      <div class="chain-output" data-chain-output="${idx}">${escText(ex.output || '')}</div>
    </div>
  </div>`;
}

      const result = simulate(code, lang, defaultOutput);

      return;

  });

  // ── Quiz ──
  renderQuiz();

  renderCategoryPills();
  renderDiffPills();
  renderContent();
});

// ── Simulator — explain or echo expected behavior ──
function simulate(code, lang, defaultOutput) {
  if (defaultOutput && defaultOutput.trim()) return defaultOutput;
  const trimmed = code.trim();
  const now = new Date().toTimeString().slice(0,8);

  // ── Slash commands (rich, realistic output) ──
  if (/^\/loop\s+/i.test(trimmed)) {
    const m = trimmed.match(/^\/loop\s+(\S+)\s+(.+)/);
    const interval = m ? m[1] : '5m';
    const task = m ? m[2] : 'the task';
    return `[loop] Started: every ${interval} → ${task.slice(0,60)}\n[loop] iter 1 @ ${now}  ✓ completed (12s)\n[loop] iter 2 @ ${now}  ✓ completed (14s)\n[loop] iter 3 @ ${now}  ✗ failed — fixing...\n[loop] iter 3 @ ${now}  ✓ fixed and verified\n  (Press Ctrl+C to stop the loop)`;
  }
  if (/^\/clear\b/i.test(trimmed)) return '✓ Conversation history cleared.\n  Files, git state, and settings preserved.\n  Ready for a new task.';
  if (/^\/init\b/i.test(trimmed)) return 'Scanning repository structure...\n  ✓ Detected: TypeScript + React + Vite\n  ✓ Detected: Jest for testing, ESLint for lint\n  ✓ Reading package.json, tsconfig.json, README.md\n  ✓ Writing CLAUDE.md (43 lines)\n\nCLAUDE.md created. Review and edit to add team conventions.';
  if (/^\/review\b/i.test(trimmed)) return 'Reviewing 4 files changed on current branch...\n  src/api/auth.ts:42  ⚠ Missing input validation\n  src/utils/hash.ts   ✓ Looks good\n  src/api/refund.ts:18 ✗ Potential null dereference\n3 issues found (1 critical, 1 warning, 1 info)';
  if (/^\/model\b/i.test(trimmed)) return '✓ Switched model.\n  Conversation context preserved.';
  if (/^\/fast\b/i.test(trimmed)) return '⚡ Fast mode toggled.';
  if (/^\/compact\b/i.test(trimmed)) return 'Compacting conversation...\n  ✓ Summarized 32 earlier messages → 1 summary\n  ✓ Preserved last 8 messages verbatim\n  ✓ Freed ~18k tokens of context\n\nReady to continue.';
  if (/^\/help\b/i.test(trimmed)) return 'Available commands:\n  /clear  /init  /review  /loop  /model  /fast  /compact  /resume\n  /memory /skills /hooks /agents /status /undo /config /pr /export';
  if (/^\//.test(trimmed)) {
    const cmd = trimmed.split(/\s+/)[0];
    return `${cmd} executed in Claude Code session.\n  (Output depends on your current session context — see card description above)`;
  }

  // ── Bash with real-looking output ──
  if (lang === 'bash' || !lang) {
    const firstCmd = trimmed.split('\n').find(l => l && !l.startsWith('#')) || trimmed;
    if (/npm\s+test/.test(firstCmd)) return '> npm test\n\n PASS  src/utils/parser.test.ts  (24 tests)\n PASS  src/api/charge.test.ts   (18 tests)\n PASS  src/auth/session.test.ts (12 tests)\n\nTest Suites: 3 passed, 3 total\nTests:       54 passed, 54 total\nTime:        3.42s';
    if (/npm\s+run\s+build/.test(firstCmd)) return '> npm run build\n\n  ✓ TypeScript: 0 errors\n  ✓ Bundle: 142.3 KB (gzipped: 42.1 KB)\n  ✓ Build complete in 4.1s';
    if (/npm\s+install/.test(firstCmd)) return '> npm install\n\nadded 234 packages, audited 235 packages in 8s\n  found 0 vulnerabilities';
    if (/git\s+status/.test(firstCmd)) return "On branch feature/payments\nYour branch is up to date with 'origin/feature/payments'.\n\nChanges not staged for commit:\n  modified:   src/api/charge.ts\n  modified:   src/utils/format.ts\n\nno changes added to commit";
    if (/git\s+log/.test(firstCmd)) return 'commit a3f2b1c (HEAD -> feature/payments)\nAuthor: you <you@example.com>\n    feat: add Stripe charge endpoint\n\ncommit 7d8e9a1\n    chore: bump deps';
    if (/git\s+commit/.test(firstCmd)) return '[feature/payments a3f2b1c] feat: add Stripe charge endpoint\n 2 files changed, 47 insertions(+), 3 deletions(-)';
    if (/git\s+push/.test(firstCmd)) return 'Enumerating objects: 12, done.\nCounting objects: 100% (12/12), done.\nWriting objects: 100% (8/8), 1.4 KiB\nTo origin\n   7d8e9a1..a3f2b1c  feature/payments -> feature/payments';
    if (/curl\s+/.test(firstCmd)) return `> ${firstCmd.slice(0,60)}\n\nHTTP/2 200\ncontent-type: application/json\n\n{\n  "status": "ok",\n  "uptime": 84321\n}`;
    if (/tail\s+-f/.test(firstCmd)) return '[14:02:18] INFO  GET /api/users 200 12ms\n[14:02:19] INFO  POST /api/auth/login 200 47ms\n[14:02:22] WARN  Rate limit warning for IP 10.0.0.42\n[14:02:24] ERROR Database connection pool exhausted\n  (streaming — Ctrl+C to stop)';
    if (/while\s+true/.test(trimmed)) return '[loop] iter 1 — ✓ ok\n[loop] iter 2 — ✓ ok\n[loop] iter 3 — ⚠ slow (2.1s)\n[loop] iter 4 — ✓ ok\n  (loop continues until interrupted)';
    if (/^echo\s+/.test(firstCmd)) return firstCmd.replace(/^echo\s+["']?/, '').replace(/["']?\s*$/, '');
    if (/grep|find|ls\b/.test(firstCmd)) return `> ${firstCmd.slice(0,70)}\n\nsrc/api/charge.ts\nsrc/api/refund.ts\nsrc/utils/payments.ts\n  (3 files matched)`;
    if (/jq\s+/.test(firstCmd)) return `> ${firstCmd.slice(0,60)}\n\n{\n  "status": "ok",\n  "count": 42\n}`;
    if (/docker\s+/.test(firstCmd)) return `> ${firstCmd.slice(0,60)}\n\nCONTAINER ID   IMAGE         STATUS\n3a8f2b1c       myapp:latest  Up 2 hours\n  1 container running`;
    if (/kubectl\s+/.test(firstCmd)) return `> ${firstCmd.slice(0,60)}\n\nNAME              READY   STATUS    RESTARTS   AGE\napp-7d8b6f-xkz2   1/1     Running   0          2d\napp-7d8b6f-mn4p   1/1     Running   0          2d`;
    return `> ${firstCmd.slice(0,70)}\n\n(executed successfully)\nexit 0`;
  }

  // ── JSON ──
  if (lang === 'json') {
    try {
      const parsed = JSON.parse(trimmed);
      const keys = Object.keys(parsed);
      const sample = JSON.stringify(parsed, null, 2).slice(0, 350);
      return `✓ Valid JSON — ${keys.length} top-level key(s): ${keys.slice(0,5).join(', ')}\n\n${sample}${sample.length === 350 ? '\n  ...(truncated)' : ''}`;
    } catch (err) { return `✗ Invalid JSON: ${err.message}`; }
  }

  if (lang === 'yaml' || lang === 'toml') {
    const lines = trimmed.split('\n').filter(l => l.trim() && !l.trim().startsWith('#'));
    return `✓ ${lang.toUpperCase()} parsed (${lines.length} non-comment lines)\n  Drop this into your config file — will be picked up on next run.\n\nKey settings:\n${lines.slice(0,4).map(l => '  • ' + l.trim()).join('\n')}`;
  }

  if (lang === 'javascript' || lang === 'typescript') {
    const funcs = (trimmed.match(/\b(function|const\s+\w+\s*=\s*(?:async\s*)?\(|class\s+\w+)/g) || []).length;
    const hasAgent = /Agent\s*\(/.test(trimmed);
    if (hasAgent) {
      const desc = (trimmed.match(/description:\s*["']([^"']+)/) || [])[1] || 'task';
      const subagent = (trimmed.match(/subagent_type:\s*["']([^"']+)/) || [])[1] || 'general-purpose';
      return `[Agent spawned]\n  → Description: ${desc}\n  → Subagent: ${subagent}\n  → Status: running...\n  → Estimated time: 30-90s\n\n(Agent runs in isolated context. Result returns to the main session.)`;
    }
    return `✓ ${lang} parsed — ${trimmed.split('\n').length} lines, ${funcs} function/class definitions\n  Run with: ${lang === 'typescript' ? 'tsx' : 'node'} script.${lang === 'typescript' ? 'ts' : 'js'}\n  Expected behavior: see "Why this matters" above.`;
  }

  if (lang === 'sql') {
    if (/CREATE\s+TABLE/i.test(trimmed)) return 'CREATE TABLE\nTime: 18 ms\n  Table created successfully.';
    if (/SELECT/i.test(trimmed)) return ' id  |     email     |    role\n-----+---------------+----------\n   1 | a@example.com | admin\n   2 | b@example.com | user\n   3 | c@example.com | user\n(3 rows)\nTime: 4.2 ms';
    const m = trimmed.match(/^(INSERT|UPDATE|DELETE)/i);
    if (m) return `${m[1]} 1\nTime: 2.1 ms`;
    return 'SQL executed.\nTime: 5.3 ms';
  }

  if (lang === 'python') return '$ python script.py\n\n✓ Imports resolved\n✓ Script ran without errors\n  Output depends on input — see "Why this matters" for what to expect.';

  if (lang === 'markdown' || lang === 'text' || lang === 'md') {
    const lines = trimmed.split('\n').length;
    const headings = (trimmed.match(/^#+\s/gm) || []).length;
    return `📄 Rendered as Markdown\n  ${lines} lines, ${headings} headings\n  Drop this into your project — Claude reads it on every session.`;
  }

  if (lang === 'html') return `<HTML output>\n  ${trimmed.split('\n').length} lines of markup\n  Open in a browser to preview.`;

  return `Executed.\n  Language: ${lang}\n  Lines: ${trimmed.split('\n').length}\n  See "Why this matters" above for expected behavior.`;
}

// ── Quiz data ──
const QUIZ_QUESTIONS = [
  {
    q: "You just finished debugging a tricky auth bug and now want to start a separate task — adding a payments feature. Your session is full of auth-related context. What's the smartest first move?",
    options: [
      "Start typing the feature request immediately",
      "/clear — wipe the stale context before switching tasks",
      "/compact — summarise old messages and continue",
      "Ask Claude to 'forget' the previous task"
    ],
    answer: 1,
    explain: "/clear resets the conversation context without touching your files or git state. Stale context from a previous task causes Claude to make wrong assumptions — always /clear between unrelated tasks."
  },
  {
    q: "You've cloned a large TypeScript monorepo. Before writing a single line of code, what's the single best first command to give Claude?",
    options: [
      "Ask Claude to read every file in the repo",
      "Paste the README into chat",
      "/init — generate a CLAUDE.md with conventions, stack, and constraints",
      "/model claude-opus-4-7 to maximise capability"
    ],
    answer: 2,
    explain: "/init scans your repo and writes a CLAUDE.md with the tech stack, test setup, and file conventions. Claude reads it at every session start — so you never have to re-explain the project."
  },
  {
    q: "After 2 hours of work, you've modified 8 files on your payments branch. Before pushing, you want to catch security issues and style violations. What do you type?",
    options: [
      "/loop 5m git diff",
      "Ask Claude 'is everything ok?'",
      "/review",
      "/compact"
    ],
    answer: 2,
    explain: "/review reads your current branch diff and gives a structured review — catching security holes, null dereferences, and style issues — without needing a GitHub PR."
  },
  {
    q: "A specific network test fails intermittently. You want Claude to run it every 3 minutes and auto-fix the first failure it sees. What do you type?",
    options: [
      "/loop 3m npm test -- --testPathPattern=network; if it fails fix the first failure",
      "/monitor npm test",
      "Manually run npm test and paste the failure each time",
      "/review the test file"
    ],
    answer: 0,
    explain: "/loop runs a task on a recurring interval. Combine it with a fix instruction and Claude will babysit the test suite — running, detecting failures, and patching them automatically."
  },
  {
    q: "A colleague emails you a zip of source code changes from another branch. You want to apply them safely. What's the right first step?",
    options: [
      "Unzip manually and paste each file into chat",
      "Tell Claude the zip path and ask it to summarise what changed before applying anything",
      "Ask Claude to apply everything immediately without reviewing",
      "/init to scan the zip"
    ],
    answer: 1,
    explain: "Always ask for a summary before applying — Claude will list modified, added, and removed files. This surfaces surprises (deleted functions, renamed exports) before anything breaks."
  },
  {
    q: "You're adding a third-party payment API. You have docs at a URL and the key in .env. Which order of steps is safest?",
    options: [
      "Code first, security review later, tests optional",
      "Share the docs URL and key location → OWASP security review → repository pattern wrapper → tests → /review",
      "Skip OWASP — it's a trusted third-party API",
      "Paste the entire docs into chat and say 'just do it'"
    ],
    answer: 1,
    explain: "Security review before coding catches design mistakes early — like missing timeouts, logging API keys, or skipping HTTPS enforcement. Fixing those after the code is written is much harder."
  },
  {
    q: "A TypeError is flooding ./logs/error.log in production. Before touching any code, what should you do?",
    options: [
      "Edit the file that threw the error immediately",
      "Ask Claude to read the log, reproduce the bug locally, then write a failing test first",
      "/review the current branch",
      "Deploy a hotfix to stop the error logs"
    ],
    answer: 1,
    explain: "Writing a failing test first is the TDD bug-fix pattern. It proves you've reproduced the bug correctly and guarantees the fix actually works — not just that the error stopped appearing."
  },
  {
    q: "You're deep in a refactor and Claude seems to be forgetting earlier decisions. Context is long but you don't want to lose the last 10 messages. What do you do?",
    options: [
      "/clear — wipe everything and start fresh",
      "/compact — summarise old messages while keeping recent ones intact",
      "Copy the conversation to a text file and paste it back",
      "/model switch to a larger context model"
    ],
    answer: 1,
    explain: "/compact summarises earlier turns into a compact summary and keeps recent messages verbatim. You get most of your context budget back without losing the current thread."
  },
  {
    q: "You need to: (a) refactor the auth module, (b) add API input validation, (c) update the DB schema. These three tasks are independent. What's the most efficient approach?",
    options: [
      "Do them sequentially in one long conversation",
      "Launch three subagents in parallel, one per task",
      "Ask Claude to tackle all three in one massive prompt",
      "/loop through each task one at a time"
    ],
    answer: 1,
    explain: "Independent tasks run in parallel with no waiting. Three subagents finish in roughly the time it takes one subagent to do one task — that's a 3x speed-up."
  },
  {
    q: "Your team practices TDD. You're adding a calculateDiscount() function. In what order should you work?",
    options: [
      "Write the function, then write tests to verify it works",
      "Write tests that fail first, implement until they pass, then refactor",
      "Write the function, skip tests, /review instead",
      "Ask Claude to write both function and tests simultaneously"
    ],
    answer: 1,
    explain: "Red → Green → Refactor. Writing the failing test first proves the test actually tests something. If you write the implementation first, you may write a test that's already green and tells you nothing."
  },
  {
    q: "Every time Claude runs git push, you want a Slack notification sent automatically — without Claude needing to remember to do it each time. How?",
    options: [
      "Put a reminder in CLAUDE.md",
      "Ask Claude to send the notification after each push",
      "Add a PostToolUse hook that fires on Bash tool calls containing 'git push'",
      "Use /loop to watch for new commits"
    ],
    answer: 2,
    explain: "PostToolUse hooks fire after any tool call and run a shell script. They're deterministic — Claude can't forget to trigger them. Perfect for notifications, audit logs, and side-effects."
  },
  {
    q: "You're using Claude Code in a remote web session. You've written 200 lines of new code. The session will end in a few minutes. What must you do?",
    options: [
      "Save files to /tmp — they'll persist across sessions",
      "/compact so Claude remembers your work",
      "Commit and push to git — remote containers are ephemeral",
      "Download the files via the browser download manager"
    ],
    answer: 2,
    explain: "Remote Claude Code containers are reclaimed after inactivity. /tmp, memory, and in-session changes all vanish. Git is the only durable store — always commit and push before stepping away."
  },
  {
    q: "You're batch-processing 50,000 simple CSV rows — just reformatting dates and normalising casing. Speed and cost matter. Which model?",
    options: [
      "Claude Opus — most capable, handles everything",
      "Claude Sonnet — the safe daily-driver default",
      "Claude Haiku — fastest and cheapest for simple, high-volume tasks",
      "It doesn't matter which model you pick"
    ],
    answer: 2,
    explain: "Simple, high-volume tasks don't need Opus reasoning or Sonnet quality. Haiku runs faster and costs a fraction of Opus — matching the model to the task is a core cost discipline."
  },
  {
    q: "Your team uses tabs (not spaces), snake_case variables, and a specific commit format. You keep re-explaining these rules every session. What's the fix?",
    options: [
      "Start every session with a long system message listing the rules",
      "Write the conventions into CLAUDE.md so Claude reads them automatically at session start",
      "/model switch to a more instruction-following model",
      "Add a manual reminder to each individual prompt"
    ],
    answer: 1,
    explain: "CLAUDE.md is read at every session start. Put your team conventions there once and they're always in context — no re-explaining, no forgotten rules."
  },
  {
    q: "You want Claude to attempt a large, risky module extraction, but don't want to risk breaking your working branch. What's the safest approach?",
    options: [
      "Let Claude work directly on main",
      "Create a new branch manually, then run Claude",
      "Launch the agent with isolation: 'worktree' — it works on an isolated copy, cleaned up automatically",
      "/compact before starting to protect context"
    ],
    answer: 2,
    explain: "isolation: 'worktree' spins up a temporary git worktree on a separate branch. The agent makes changes there, not on your working branch. If it makes no changes, the worktree is cleaned up automatically."
  },
];

// ── Quiz state ──
const quizState = { submitted: {}, score: 0, selected: {} };

function renderQuiz() {
  const el = document.getElementById('cert-quiz');
  if (!el) return;
  el.innerHTML = `
    <div class="cert-quiz-header">
      <h2>🎓 Claude Code Certified</h2>
      <p>15 real-world scenarios. Choose the best response, hit Submit, and read why. Score 12+ to earn your certificate.</p>
    </div>
    <div class="cert-progress" id="cert-progress">0 / 15 answered</div>
    ${QUIZ_QUESTIONS.map((q, qi) => `
      <div class="cert-q" data-qi="${qi}">
        <div class="cert-q-num">Scenario ${qi + 1} of ${QUIZ_QUESTIONS.length}</div>
        <div class="cert-q-text">${escText(q.q)}</div>
        <div class="cert-options">
          ${q.options.map((opt, oi) => `
            <button class="cert-option" data-qi="${qi}" data-oi="${oi}">
              <span class="cert-option-letter">${String.fromCharCode(65 + oi)}</span>
              <span>${escText(opt)}</span>
            </button>
          `).join('')}
        </div>
        <button class="cert-submit" data-submit="${qi}" disabled>Submit answer</button>
        <div class="cert-explanation" data-explain="${qi}"></div>
      </div>
    `).join('')}
    <div class="cert-final" id="cert-final">
      <h3>All done!</h3>
      <div class="cert-final-score" id="cert-final-score"></div>
      <p id="cert-final-msg"></p>
      <div class="cert-card" id="cert-card">
        <div class="cert-card-gradient">
          <div class="cert-card-inner">
            <div class="cert-trophy">🏆</div>
            <div class="cert-heading">Claude Code Practitioner</div>
            <div class="cert-subheading">Certificate of Proficiency</div>
            <div class="cert-certifies">This certifies that</div>
            <input type="text" class="cert-name-input" id="cert-name-input" placeholder="Type your name here" maxlength="60" />
            <div class="cert-body-text">has demonstrated proficiency in Claude Code patterns, prompt chains, and real-world developer workflows.</div>
            <div class="cert-metadata">
              <span class="cert-score-pill" id="cert-score-pill"></span>
              <span class="cert-date-text" id="cert-date-text"></span>
            </div>
            <div class="cert-domain">700799.github.io/claudecodey</div>
          </div>
        </div>
        <div class="cert-buttons">
          <button class="cert-btn-print" id="cert-btn-print">🖨 Print Certificate</button>
          <button class="cert-btn-linkedin" id="cert-btn-linkedin">💼 Copy for LinkedIn</button>
        </div>
      </div>
    </div>
  `;

  el.addEventListener('click', e => {
    const opt = e.target.closest('.cert-option');
    if (opt) {
      const qi = +opt.dataset.qi;
      const oi = +opt.dataset.oi;
      if (quizState.submitted[qi]) return;
      quizState.selected[qi] = oi;
      el.querySelectorAll(`.cert-option[data-qi="${qi}"]`).forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      el.querySelector(`[data-submit="${qi}"]`).disabled = false;
      return;
    }
    const submit = e.target.closest('.cert-submit');
    if (submit) {
      const qi = +submit.dataset.submit;
      if (quizState.submitted[qi]) return;
      const selected = quizState.selected[qi];
      const correct = QUIZ_QUESTIONS[qi].answer;
      quizState.submitted[qi] = true;
      el.querySelectorAll(`.cert-option[data-qi="${qi}"]`).forEach((o, idx) => {
        o.classList.remove('selected');
        if (idx === correct) o.classList.add('correct');
        else if (idx === selected) o.classList.add('wrong');
      });
      if (selected === correct) quizState.score++;
      const exp = el.querySelector(`[data-explain="${qi}"]`);
      const verdict = selected === correct ? '<strong>✓ Correct!</strong>' : '<strong>✗ Not quite.</strong>';
      exp.innerHTML = `${verdict} ${escText(QUIZ_QUESTIONS[qi].explain)}`;
      exp.classList.add('shown');
      submit.disabled = true;
      submit.textContent = 'Submitted';
      const answered = Object.keys(quizState.submitted).length;
      document.getElementById('cert-progress').textContent = `${answered} / ${QUIZ_QUESTIONS.length} answered`;
      if (answered === QUIZ_QUESTIONS.length) {
        const final = document.getElementById('cert-final');
        document.getElementById('cert-final-score').textContent = `${quizState.score} / ${QUIZ_QUESTIONS.length}`;
        let msg = '';
        if (quizState.score >= 13) msg = '🏆 Top of the class. You know Claude Code inside out.';
        else if (quizState.score >= 12) msg = '🎉 Passed! You\'ve got the fundamentals locked in.';
        else if (quizState.score >= 9) msg = '📚 Solid foundation. Review the scenarios you missed, then retake.';
        else msg = '💡 Keep exploring. Browse the Prompting and Chains sections, then retake.';
        document.getElementById('cert-final-msg').textContent = msg;
        // Set up certificate
        const tier = quizState.score >= 13 ? 'Expert' : quizState.score >= 12 ? 'Advanced' : quizState.score >= 9 ? 'Practitioner' : 'Learner';
        document.getElementById('cert-score-pill').textContent = `Score: ${quizState.score} / ${QUIZ_QUESTIONS.length} · ${tier}`;
        document.getElementById('cert-date-text').textContent = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        document.querySelector('.cert-heading').textContent = `Claude Code ${tier}`;
        const certCard = document.getElementById('cert-card');
        if (quizState.score >= 9) certCard.style.display = 'block';
        final.classList.add('shown');
        // Print button
        document.getElementById('cert-btn-print').addEventListener('click', () => window.print());
        // LinkedIn copy
        document.getElementById('cert-btn-linkedin').addEventListener('click', () => {
          const name = document.getElementById('cert-name-input').value.trim();
          const dateStr = document.getElementById('cert-date-text').textContent;
          const intro = name ? `${name} just earned` : 'I just earned';
          const text = `${intro} the Claude Code ${tier} Certificate! 🏆\n\nScore: ${quizState.score}/${QUIZ_QUESTIONS.length} · ${dateStr}\n\nTest your Claude Code knowledge at:\nhttps://700799.github.io/claudecodey\n\n#ClaudeCode #AI #DeveloperTools #Anthropic`;
          navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('cert-btn-linkedin');
            btn.textContent = '✓ Copied to clipboard!';
            setTimeout(() => btn.textContent = '💼 Copy for LinkedIn', 2000);
          });
        });
      }
      return;
    }
  });
}
