<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Claude Code Missing Manual</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<style>
:root {
  --yellow: #FED90F;
  --yellow-dark: #E8C400;
  --yellow-pale: #FFF9D6;
  --sky: #70C8F0;
  --sky-dark: #3AACD8;
  --donut-pink: #E34F8E;
  --donut-glaze: #F5B8D2;
  --springfield-blue: #1B4F8A;
  --orange: #F15A22;
  --green: #4A9E2F;
  --green-pale: #E8F5E0;
  --skin: #FFD5B4;
  --dark: #111111;
  --dark2: #1C1C1C;
  --dark3: #2A2A2A;
  --card-bg: #1E1E1E;
  --card-border: #333333;
  --text: #EFEFEF;
  --text-muted: #9A9A9A;
  --code-bg: #0A0A0A;
  --radius: 14px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== SPRINGFIELD SKY HEADER ===== */
.sky-header {
  background: linear-gradient(180deg, #1B4F8A 0%, #2E7DD6 40%, #70C8F0 80%, #A8DFF0 100%);
  padding: 0;
  position: relative;
  overflow: hidden;
}

.clouds {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
}

.cloud {
  position: absolute;
  background: rgba(255,255,255,0.85);
  border-radius: 50px;
  filter: blur(1px);
}
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: inherit;
  border-radius: 50%;
}
.cloud-1 { width: 120px; height: 35px; top: 15%; left: 5%; animation: drift 18s linear infinite; }
.cloud-1::before { width: 60px; height: 55px; top: -30px; left: 15px; }
.cloud-1::after { width: 50px; height: 45px; top: -20px; right: 15px; }
.cloud-2 { width: 160px; height: 40px; top: 30%; left: 60%; animation: drift 25s linear infinite reverse; }
.cloud-2::before { width: 80px; height: 60px; top: -35px; left: 20px; }
.cloud-2::after { width: 60px; height: 50px; top: -25px; right: 20px; }
.cloud-3 { width: 90px; height: 28px; top: 55%; left: 30%; animation: drift 20s linear infinite; }
.cloud-3::before { width: 45px; height: 40px; top: -22px; left: 10px; }
.cloud-3::after { width: 38px; height: 35px; top: -18px; right: 10px; }

@keyframes drift {
  0% { transform: translateX(-200px); }
  100% { transform: translateX(calc(100vw + 200px)); }
}

.header-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 48px 24px 32px;
}

.donut-row {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 16px;
  font-size: 2.2rem;
  animation: bounce-donuts 2s ease-in-out infinite alternate;
}

@keyframes bounce-donuts {
  from { transform: translateY(0); }
  to { transform: translateY(-8px); }
}

h1 {
  font-family: 'Permanent Marker', cursive;
  font-size: clamp(2rem, 6vw, 4rem);
  color: var(--yellow);
  text-shadow: 3px 3px 0 var(--springfield-blue), 5px 5px 0 rgba(0,0,0,0.3);
  line-height: 1.1;
  margin-bottom: 8px;
  letter-spacing: -1px;
}

.subtitle {
  font-family: 'Permanent Marker', cursive;
  font-size: clamp(0.9rem, 2.5vw, 1.3rem);
  color: #FFF;
  text-shadow: 1px 1px 0 var(--springfield-blue);
  margin-bottom: 24px;
  opacity: 0.95;
}

/* ===== STICKY NAV ===== */
.sticky-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(17,17,17,0.97);
  backdrop-filter: blur(12px);
  border-bottom: 2px solid var(--card-border);
  padding: 12px 16px 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.nav-row {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.row-label {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.pills {
  display: flex;
  gap: 6px;
  flex-wrap: nowrap;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.pills::-webkit-scrollbar { display: none; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1.5px solid var(--card-border);
  background: var(--dark2);
  color: var(--text-muted);
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.18s ease;
  user-select: none;
}

.pill:hover {
  border-color: var(--yellow);
  color: var(--yellow);
  background: rgba(254,217,15,0.08);
}

.pill.active-cat {
  background: var(--yellow);
  border-color: var(--yellow);
  color: var(--dark);
  box-shadow: 0 0 16px rgba(254,217,15,0.4);
}

.pill.active-diff-simple { background: #4CAF50; border-color: #4CAF50; color: #fff; }
.pill.active-diff-advanced { background: var(--sky-dark); border-color: var(--sky-dark); color: #fff; }
.pill.active-diff-expert { background: var(--donut-pink); border-color: var(--donut-pink); color: #fff; }
.pill.active-diff-overengineer { background: var(--orange); border-color: var(--orange); color: #fff; }
.pill.active-diff-mistakes { background: #8B0000; border-color: #cc0000; color: #fff; }
.pill.active-diff-all { background: var(--dark3); border-color: var(--text-muted); color: var(--text); }

.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--dark3);
  border: 1.5px solid var(--card-border);
  border-radius: 999px;
  padding: 6px 14px;
  margin-top: 6px;
}

.search-bar input {
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 0.8rem;
  width: 100%;
  font-family: 'Inter', sans-serif;
}
.search-bar input::placeholder { color: var(--text-muted); }
.search-icon { color: var(--text-muted); font-size: 0.85rem; }

[x-cloak] { display: none !important; }

/* ===== MAIN CONTENT ===== */
.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}

.category-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 24px;
  padding: 20px 24px;
  background: linear-gradient(135deg, var(--card-bg) 0%, rgba(30,30,30,0.6) 100%);
  border-radius: var(--radius);
  border-left: 4px solid var(--yellow);
  box-shadow: var(--shadow);
}

.cat-icon { font-size: 2.5rem; }

.cat-info h2 {
  font-family: 'Permanent Marker', cursive;
  font-size: 1.6rem;
  color: var(--yellow);
  margin-bottom: 4px;
}

.cat-info p {
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.5;
}

.count-badge {
  margin-left: auto;
  background: var(--yellow);
  color: var(--dark);
  font-weight: 700;
  font-size: 0.75rem;
  padding: 4px 12px;
  border-radius: 999px;
  white-space: nowrap;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

.card {
  background: var(--card-bg);
  border: 1.5px solid var(--card-border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  transform: translateY(-3px);
  border-color: rgba(254,217,15,0.3);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(254,217,15,0.1);
}

.card-header {
  padding: 14px 16px 10px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border-bottom: 1px solid var(--card-border);
}

.card-num {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--yellow);
  background: rgba(254,217,15,0.12);
  padding: 2px 6px;
  border-radius: 4px;
  margin-top: 2px;
  flex-shrink: 0;
}

.card-title {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  flex: 1;
}

.diff-badge {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 2px 8px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
}

.diff-simple { background: rgba(76,175,80,0.2); color: #81C784; border: 1px solid #4CAF50; }
.diff-advanced { background: rgba(58,172,216,0.2); color: #70C8F0; border: 1px solid #3AACD8; }
.diff-expert { background: rgba(227,79,142,0.2); color: #F48FB1; border: 1px solid #E34F8E; }
.diff-overengineer { background: rgba(241,90,34,0.2); color: #FFAB76; border: 1px solid #F15A22; }
.diff-mistakes { background: rgba(139,0,0,0.3); color: #EF9A9A; border: 1px solid #cc0000; }

.card-body {
  padding: 12px 16px;
}

.why-block {
  background: rgba(254,217,15,0.06);
  border-left: 3px solid var(--yellow);
  border-radius: 0 8px 8px 0;
  padding: 8px 12px;
  margin-bottom: 10px;
  font-size: 0.78rem;
  color: var(--text-muted);
  line-height: 1.6;
}

.why-block strong {
  color: var(--yellow);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: block;
  margin-bottom: 3px;
}

.code-block {
  border-radius: 8px;
  overflow: hidden;
  font-size: 0.73rem;
  position: relative;
}

.code-lang-tag {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
  background: rgba(0,0,0,0.4);
  padding: 1px 6px;
  border-radius: 4px;
  z-index: 1;
  pointer-events: none;
}

.code-block pre {
  margin: 0 !important;
}

.code-block code {
  font-family: 'Space Mono', monospace !important;
  font-size: 0.72rem !important;
  line-height: 1.5 !important;
}

.copy-btn {
  position: absolute;
  bottom: 6px;
  right: 8px;
  background: rgba(254,217,15,0.15);
  border: 1px solid rgba(254,217,15,0.3);
  color: var(--yellow);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 0.6rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  z-index: 2;
}

.copy-btn:hover { background: rgba(254,217,15,0.3); }

.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.no-results .emoji { font-size: 3rem; margin-bottom: 12px; }
.no-results h3 { font-size: 1.1rem; color: var(--yellow); margin-bottom: 6px; }

/* ===== FOOTER ===== */
.footer {
  background: var(--dark2);
  border-top: 2px solid var(--card-border);
  padding: 24px;
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.footer a { color: var(--yellow); text-decoration: none; }
.footer .donuts { font-size: 1.5rem; margin-bottom: 8px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .cards-grid { grid-template-columns: 1fr; }
  .token-inner { grid-template-columns: 1fr; text-align: center; }
  h1 { font-size: 1.8rem; }
}

/* ===== ANIMATIONS ===== */
@keyframes fade-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.card { animation: fade-in 0.25s ease both; }
.card:nth-child(1) { animation-delay: 0.02s; }
.card:nth-child(2) { animation-delay: 0.04s; }
.card:nth-child(3) { animation-delay: 0.06s; }
.card:nth-child(4) { animation-delay: 0.08s; }
.card:nth-child(5) { animation-delay: 0.10s; }
.card:nth-child(6) { animation-delay: 0.12s; }
.card:nth-child(7) { animation-delay: 0.14s; }
.card:nth-child(8) { animation-delay: 0.16s; }

/* Springfield grass strip */
.grass-strip {
  height: 22px;
  background: linear-gradient(180deg, #4A9E2F 0%, #3A7D24 100%);
  border-top: 3px solid #5CB833;
  position: relative;
}

.grass-strip::before {
  content: '';
  position: absolute;
  top: -8px; left: 0; right: 0;
  height: 10px;
  background: radial-gradient(ellipse 20px 10px at 50% 100%, #5CB833 0%, transparent 100%);
  background-size: 40px 10px;
  background-repeat: repeat-x;
}
</style>
</head>
<body x-data="app()">

<!-- ===== HEADER ===== -->
<div class="sky-header">
  <div class="clouds">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>
  <div class="header-content">
    <h1>The Claude Code<br>Missing Manual</h1>
    <p class="subtitle">Everything Anthropic forgot to tell you · Patterns, tricks &amp; power moves</p>
  </div>
</div>
<div class="grass-strip"></div>

<!-- ===== STICKY NAV ===== -->
<div class="sticky-nav">
  <div class="nav-row">
    <div>
      <div class="row-label">📁 Category</div>
      <div class="pills" x-cloak>
        <template x-for="cat in categoryList" :key="cat.id">
          <button
            class="pill"
            :class="{ 'active-cat': activeCategory === cat.id }"
            @click="activeCategory = cat.id"
            x-text="cat.icon + ' ' + cat.title"
          ></button>
        </template>
      </div>
    </div>
    <div>
      <div class="row-label">⚡ Difficulty</div>
      <div class="pills">
        <button class="pill" :class="activeDifficulty==='all' ? 'active-diff-all' : ''" @click="activeDifficulty='all'">🌐 All</button>
        <button class="pill" :class="activeDifficulty==='simple' ? 'active-diff-simple' : ''" @click="activeDifficulty='simple'">🟢 Simple</button>
        <button class="pill" :class="activeDifficulty==='advanced' ? 'active-diff-advanced' : ''" @click="activeDifficulty='advanced'">🔵 Advanced</button>
        <button class="pill" :class="activeDifficulty==='expert' ? 'active-diff-expert' : ''" @click="activeDifficulty='expert'">🔴 Expert</button>
        <button class="pill" :class="activeDifficulty==='overengineer' ? 'active-diff-overengineer' : ''" @click="activeDifficulty='overengineer'">🟠 OK to Over-Engineer</button>
        <button class="pill" :class="activeDifficulty==='mistakes' ? 'active-diff-mistakes' : ''" @click="activeDifficulty='mistakes'">💀 Mistakes to Avoid</button>
      </div>
    </div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search examples, patterns, commands…" x-model="searchQuery">
    </div>
  </div>
</div>

<!-- ===== MAIN ===== -->
<div class="main">
  <template x-if="currentCategory">
    <div>
      <div class="category-header">
        <div class="cat-icon" x-text="currentCategory.icon"></div>
        <div class="cat-info">
          <h2 x-text="currentCategory.title"></h2>
          <p x-text="currentCategory.description"></p>
        </div>
        <div class="count-badge" x-text="filteredExamples.length + ' examples'"></div>
      </div>

      <template x-if="filteredExamples.length === 0">
        <div class="no-results">
          <div class="emoji">🍩</div>
          <h3>No examples match your filters</h3>
          <p>Try a different difficulty level or clear your search</p>
        </div>
      </template>

      <div class="cards-grid">
        <template x-for="(ex, idx) in filteredExamples" :key="ex.title">
          <div class="card">
            <div class="card-header">
              <div class="card-num" x-text="String(idx+1).padStart(2,'0')"></div>
              <div class="card-title" x-text="ex.title"></div>
              <div class="diff-badge" :class="'diff-'+ex.difficulty" x-text="diffLabel(ex.difficulty)"></div>
            </div>
            <div class="card-body">
              <div class="why-block">
                <strong>Why this matters</strong>
                <span x-text="ex.why"></span>
              </div>
              <div class="code-block" style="position:relative">
                <div class="code-lang-tag" x-text="ex.lang || 'bash'"></div>
                <pre><code :class="'language-'+(ex.lang||'bash')" x-html="highlight(ex.code, ex.lang||'bash')"></code></pre>
                <button class="copy-btn" @click="copyCode(ex.code, $event)">COPY</button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>

<!-- ===== FOOTER ===== -->
<div class="footer">
  <p>The Claude Code Missing Manual &mdash; Community-powered patterns &amp; power moves</p>
  <p style="margin-top:6px"><a href="https://docs.anthropic.com/en/docs/claude-code">Claude Code Docs</a> · <a href="https://github.com/anthropics/claude-code">GitHub</a> · Built for Springfield, deployed everywhere</p>
</div>

<script>
// CATEGORIES is a plain global — NOT reactive.
// Alpine only proxies the 3 scalar state values in app(), keeping startup fast on mobile.
const CATEGORIES = {

      // ===================================================
      // 1. LOOPS
      // ===================================================
      loops: {
        icon: '🔄',
        title: 'Loops',
        description: 'Recurring tasks, polling, and long-running workflows using /loop and shell patterns. Keep Claude working while you sleep.',
        examples: [
          {
            title: 'Basic /loop — poll every 10 minutes',
            difficulty: 'simple',
            why: 'The built-in /loop skill runs a slash command on an interval. Set it and forget it — Claude wakes up, checks state, acts, sleeps.',
            lang: 'bash',
            code: `/loop 10m /status-check
# Runs /status-check every 10 minutes until you stop it`
          },
          {
            title: 'Loop until tests pass',
            difficulty: 'simple',
            why: 'Instead of babysitting CI yourself, tell Claude to keep iterating until tests go green. The loop stops when you hit the exit condition.',
            lang: 'bash',
            code: `/loop 2m until tests pass: run npm test, if failing fix the first error then stop`
          },
          {
            title: 'Exponential backoff loop',
            difficulty: 'advanced',
            why: 'Avoid hammering APIs or services. Backoff prevents rate-limit errors that cause the entire workflow to fail.',
            lang: 'bash',
            code: `# CLAUDE.md snippet — teach Claude this pattern:
# Retry with exponential backoff
for i in 1 2 3 4; do
  if command_that_might_fail; then
    break
  fi
  sleep $((2 ** i))
done`
          },
          {
            title: 'CI babysitting loop',
            difficulty: 'simple',
            why: 'Subscribe to PR events and let Claude monitor CI. When a check fails, Claude diagnoses and pushes a fix automatically.',
            lang: 'bash',
            code: `/loop 5m check CI on PR #42 — if red, read the failure log and push a fix`
          },
          {
            title: 'Deploy monitoring loop',
            difficulty: 'advanced',
            why: 'After a deploy, you want real-time signal. This loop pings a health endpoint and alerts on degradation without you watching a dashboard.',
            lang: 'bash',
            code: `/loop 1m curl https://api.myapp.com/health | jq .status
# If status != "ok", create a GitHub issue with the response body`
          },
          {
            title: 'Rate-limited loop (stay under API quotas)',
            difficulty: 'advanced',
            why: 'When processing many items, a naive loop exhausts rate limits. Add a sleep between batches to stay in quota.',
            lang: 'bash',
            code: `# Process 100 files, 10 at a time, with a pause between batches
for batch in $(seq 0 10 99); do
  process_files $batch $((batch+9))
  sleep 60  # respect 1 req/min limit
done`
          },
          {
            title: 'Loop with state file',
            difficulty: 'advanced',
            why: 'Loops that restart from the beginning waste tokens. A state file lets you resume from where you left off — essential for 24-hour runs.',
            lang: 'bash',
            code: `# Claude reads/writes .loop-state.json each iteration
# {\"last_processed\": 42, \"errors\": [], \"started\": \"2024-01-15\"}
STATE=$(cat .loop-state.json 2>/dev/null || echo '{}')
LAST=$(echo $STATE | jq .last_processed // 0)
# process from $LAST onward, then update the file`
          },
          {
            title: 'Slack webhook alert from loop',
            difficulty: 'advanced',
            why: 'A loop that fails silently is worse than no loop. Wire in a Slack webhook so you get a ping on your phone when something goes wrong.',
            lang: 'bash',
            code: `# In your hook or loop body:
curl -X POST $SLACK_WEBHOOK_URL \
  -H 'Content-type: application/json' \
  -d '{"text": "⚠️ Loop alert: deploy failed at step 3"}'`
          },
          {
            title: 'Nested loop — outer retry, inner task',
            difficulty: 'expert',
            why: 'Some workflows need two levels: retry the whole task on transient failure, but step through sub-tasks in order. Nesting gives you both.',
            lang: 'bash',
            code: `for attempt in 1 2 3; do
  success=true
  for step in lint test build deploy; do
    claude "run $step step" || { success=false; break; }
  done
  $success && break
  echo "Attempt $attempt failed, retrying..."

  constructor(threshold = 3, timeout = 30000) {
    this.failures = 0;
    this.threshold = threshold;
    this.timeout = timeout;
    this.state = 'closed'; // closed=normal, open=failing, half-open=testing
    this.nextAttempt = 0;
  }
  async call(fn) {
    if (this.state === 'open') {
      if (Date.now() < this.nextAttempt) throw new Error('Circuit open');
      this.state = 'half-open';
    }
    try {
      const result = await fn();
      this.reset();
      return result;
    } catch (e) {
      this.failure();
      throw e;
    }
  }
  failure() { this.failures++; if (this.failures >= this.threshold) { this.state='open'; this.nextAttempt=Date.now()+this.timeout; } }
  reset() { this.failures=0; this.state='closed'; }
}`
